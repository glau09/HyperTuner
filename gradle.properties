# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Added --add-opens flags to fix Kotlin/KSP ApplicationManager errors on GitHub Actions CI.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true
org.gradle.caching=true

# Disabled configuration cache to prevent CI headless build crashes with KSP
org.gradle.configuration-cache=false

# Set the maximum number of workers to 4 to avoid overloading the machine.
org.gradle.workers.max=4

# Set the Kotlin compiler execution strategy to in-process to avoid "Could not
# connect to Kotlin compile daemon" error.
kotlin.compiler.execution.strategy=in-process

# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true

# Prevent testOnly attribute from being injected so APK installs cleanly via USB
android.injected.testOnly=false

# Enable AndroidX support
android.useAndroidX=true
android.enableJetifier=true
